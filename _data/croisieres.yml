# Croisières en flottille de la section habitable, affichées sur /habitable/croisieres.html.
# À mettre à jour chaque année : la page met automatiquement en avant la prochaine.
#
# Pour chaque croisière :
#   nom             : nom ou destination affiché
#   debut           : premier jour (AAAA-MM-JJ), sert au tri, au compte à rebours et au statut
#   fin             : dernier jour (AAAA-MM-JJ)
#   dates           : dates affichées en toutes lettres
#   lieu            : zone de navigation (facultatif)
#   dates_initiales : anciennes dates, affichées barrées en cas de report (facultatif)
#   annulee         : true si la croisière est annulée (facultatif)
#   motif           : raison de l'annulation, affichée avec le badge (facultatif)

croisieres:
    - nom: Croisière de mai
      debut: 2026-05-23
      fin: 2026-06-05
      dates: Du 23 mai au 5 juin 2026

    - nom: Grand Largue
      debut: 2026-06-12
      fin: 2026-06-14
      dates: Du 12 au 14 juin 2026

    - nom: Croisière de juin
      debut: 2026-06-17
      fin: 2026-07-01
      dates: Du 17 juin au 1er juillet 2026

    - nom: Croisière de septembre
      debut: 2026-09-02
      fin: 2026-09-12
      dates: Du 2 au 12 septembre 2026
      dates_initiales: Du 6 au 20 septembre 2026
