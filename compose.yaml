services:
    jekyll:
        image: ruby:3.3
        working_dir: /srv/jekyll
        user: "${UID:-1000}:${GID:-1000}"
        environment:
            HOME: /tmp
        command: >
            sh -c "bundle install &&
                   bundle exec jekyll serve --host 0.0.0.0 --livereload --force_polling"
        ports:
            - "4000:4000"
            - "35729:35729"
        volumes:
            - .:/srv/jekyll
            - bundle:/usr/local/bundle

volumes:
    bundle:
