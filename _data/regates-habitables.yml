# Calendrier des régates habitables, affiché sur /habitable/regates.html.
#
# Pour chaque régate :
#   nom       : nom affiché
#   debut     : premier jour (AAAA-MM-JJ), sert au tri, au compte à rebours et au statut
#   fin       : dernier jour (facultatif, sinon égal à debut)
#   dates     : dates affichées en toutes lettres
#   lieu      : port ou commune (facultatif)
#   type      : entrainement, championnat ou evenement
#   page      : page dédiée ou site externe (facultatif)
#   documents : liste de { titre, lien } (facultatif)
#   resultats : lien vers les résultats (facultatif)

# Saison et liens d'inscription : voir _data/club.yml.

documents_entrainement: &documents_entrainement
    - titre: Avis de course
      lien: "/assets/habitable/regates/AC - Régates d'entrainements CVGV 2026.pdf"
    - titre: Instructions de course
      lien: "/assets/habitable/regates/IC - Régates d'entrainements CVGV 2026.pdf"
    - titre: Parcours
      lien: /assets/habitable/regates/Parcours Habitables CVGV 2026.pdf

